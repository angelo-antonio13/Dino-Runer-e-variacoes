<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>

    <title>Dino Run</title>
  </head>

  <body>
    <main class="game">
      <div class="game-header">
        <div class="logo"><span>NO</span> INTERNET</div>

        <div class="score">SCORE: <span id="score">0000</span></div>
      </div>

      <div class="game-board">
        <div class="sun"></div>

        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <div class="mountains"></div>

        <div class="dino">
          <div class="dino-eye"></div>
          <div class="dino-arm"></div>

          <div class="dino-leg leg-1"></div>
          <div class="dino-leg leg-2"></div>
        </div>

        <div class="cactus cactus-1"></div>

        <div class="ground"></div>

        <div class="game-over">
          <h1>GAME OVER</h1>

          <p>Pressione ESPAÇO para jogar novamente</p>

          <button id="restart">RECOMEÇAR</button>
        </div>
      </div>

      <p class="instructions">
        Aperte <strong>ESPAÇO</strong> ou clique na tela para pular
      </p>
    </main>
  </body>
</html>
